<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OSM Skybridge Viewer — Washington DC</title>
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9/dist.min.js"></script>
<style>
  html, body, #map { margin: 0; height: 100%; width: 100%; }
  body { font: 13px/1.4 system-ui, sans-serif; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    background: rgba(255,255,255,.94); padding: 12px 14px; border-radius: 8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25); max-width: 320px;
  }
  #panel h1 { font-size: 14px; margin: 0 0 6px; }
  #panel label { display: block; margin: 6px 0; cursor: pointer; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
  #status { color:#666; margin-top:8px; font-size:12px; }
  #tip {
    position:absolute; z-index:3; pointer-events:none; display:none;
    background:#111; color:#fff; padding:6px 8px; border-radius:4px; font-size:12px; max-width:260px;
  }
  button { font: inherit; padding: 4px 8px; border-radius:6px; border:1px solid #bbb; background:#fff; cursor:pointer; }

  /* ── live tuner panel (only shown when `make tuner` is serving /api/*) ── */
  #sandboxBadge { display:none; background:#7a3ff2; color:#fff; font-weight:600;
    font-size:11px; padding:1px 7px; border-radius:10px; margin-left:6px; vertical-align:2px; }
  #tuner { margin-top:8px; border-top:1px solid #ddd; padding-top:6px; display:none; }
  #tuner summary { cursor:pointer; font-weight:600; }
  #tuner .stage { margin:6px 0 2px; font-size:11px; text-transform:uppercase;
    letter-spacing:.4px; color:#666; }
  #tuner .stage .cost { font-weight:400; color:#999; text-transform:none; }
  #tuner .knob { display:grid; grid-template-columns: 96px 1fr 52px 16px; gap:5px;
    align-items:center; margin:2px 0; }
  #tuner .knob label { margin:0; font-size:12px; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; }
  #tuner .knob input[type=range] { width:100%; margin:0; }
  #tuner .knob input[type=number] { width:52px; font-size:11px; padding:1px 2px; }
  #tuner .knob .undo { visibility:hidden; border:none; background:none; padding:0;
    font-size:13px; line-height:1; color:#7a3ff2; cursor:pointer; }
  #tuner .dirty label { font-weight:600; color:#7a3ff2; }
  #tuner .dirty .undo { visibility:visible; }
  #tuner .buttons { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  #tuner .buttons button { font-size:12px; padding:3px 7px; }
  #tuner .buttons button:disabled { opacity:.45; cursor:default; }
  /* status chip: idle (hidden) → running (amber + spinner) → ok (green flash) → err (red) */
  #tunerStatus { margin-top:6px; font-size:12px; min-height:18px; color:#666; }
  #tunerStatus .chip { display:inline-block; padding:2px 8px; border-radius:10px; }
  #tunerStatus.run .chip { background:#fff3d6; color:#7a5200; border:1px solid #e8c874; }
  #tunerStatus.ok  .chip { background:#e2f6e6; color:#166534; border:1px solid #86d99a; }
  #tunerStatus.err .chip { background:#fdecec; color:#b00020; border:1px solid #e0b4b4; }
  #tunerStatus.run .chip::before { content:''; display:inline-block; width:9px; height:9px;
    margin-right:6px; vertical-align:-1px; border-radius:50%;
    border:2px solid #c9962a; border-top-color:transparent;
    animation: tunerspin .8s linear infinite; }
  @keyframes tunerspin { to { transform: rotate(360deg); } }
  #tunerStatus pre { max-height:110px; overflow:auto; background:#fff3f3;
    border:1px solid #e0b4b4; padding:4px; font-size:10px; white-space:pre-wrap;
    margin:4px 0 0; }

  /* read-only processing-settings panel (plain `make viewer`; hidden when the
     live tuner is active — its panel shows the same values editable) */
  #settingsRO { margin-top:8px; border-top:1px solid #ddd; padding-top:6px; display:none; }
  #settingsRO summary { cursor:pointer; font-weight:600; }
  #settingsRO .when { font-weight:400; color:#999; font-size:11px; margin-left:4px; }
  #settingsRO .grid { display:grid; grid-template-columns:auto auto; gap:1px 12px;
    max-height:220px; overflow-y:auto; margin-top:4px; font-size:11.5px; }
  #settingsRO .grid span { white-space:nowrap; }
  #settingsRO .grid .v { text-align:right; font-variant-numeric:tabular-nums; color:#333; }
  #settingsRO .share { color:#888; font-size:11px; margin-top:4px; }
  #settingsRO code { background:#f2f2f2; padding:0 3px; border-radius:3px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="tip"></div>
<div id="panel">
  <h1>OSM Skybridge Viewer — DC</h1>
  <div class="legend">
    <div><i style="background:rgb(150,160,180)"></i> building / part</div>
    <div><i style="background:rgb(120,180,255)"></i> detected skybridge / passage</div>
    <div><i style="background:rgb(235,90,90)"></i> removed from footprint</div>
  </div>
  <label title="Choose what to render">view:
    <select id="viewMode">
      <option value="raw">Raw OSM (the bug)</option>
      <option value="corrected" selected>Corrected float (lifted)</option>
      <option value="footprint">Modified footprint (cut)</option>
    </select>
  </label>
  <label title="Highlight buildings that lack a float base">
    <input type="checkbox" id="toggleMissing" /> highlight buildings missing a base
  </label>
  <label title="Show only the buildings a correction touches, plus the current view's correction overlay — declutter to just what changed">
    <input type="checkbox" id="toggleFocus" /> focus: only what changed
  </label>
  <button id="flyFocus">↪ fly to focus</button>
  <div id="status">loading…</div>

  <!-- live tuner (populated + shown only when pipeline/tuner.py serves /api/*) -->
  <details id="tuner" open>
    <summary>tuning knobs <span id="sandboxBadge">SANDBOX</span></summary>
    <div id="tunerKnobs"></div>
    <div class="buttons">
      <button id="tApply" title="Push the tuned values to the LIVE database, re-derive and re-export web/data/">apply to real dataset</button>
      <button id="tSave" title="Persist the tuned values as the defaults in sql/01_prepare.sql (same rewrite as `make tune`)">save as defaults</button>
      <button id="tRevert" title="Reset every knob to the file defaults and re-derive the sandbox">↺ reset all</button>
      <button id="tReseed" title="Rebuild the sandbox database from the raw data">reseed</button>
    </div>
    <div id="tunerStatus"></div>
  </details>

  <!-- read-only settings (populated from data/config.json under `make viewer`) -->
  <details id="settingsRO">
    <summary>processing settings <span class="when"></span></summary>
    <div class="grid"></div>
    <div class="share">share: <code>make config-export</code> → send the file →
      <code>make config-load FILE=…</code></div>
  </details>
</div>

<script>
const {MapboxOverlay, GeoJsonLayer, SolidPolygonLayer} = deck;

// Camera focus — defaults to DC's convention center; overridden by data/meta.json
// (written per-region by `make export`), so the viewer follows the loaded region.
let FOCUS = {center: [-77.0230, 38.9051], zoom: 15.3, pitch: 55, bearing: -20, label: 'convention center'};

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
  center: FOCUS.center, zoom: FOCUS.zoom, pitch: FOCUS.pitch, bearing: FOCUS.bearing,
  antialias: true
});
const overlay = new MapboxOverlay({interleaved: true, layers: []});
map.addControl(overlay);
map.addControl(new maplibregl.NavigationControl({visualizePitch: true}), 'top-right');

// mode: 'raw' | 'corrected' | 'footprint'
const state = {buildings: null, buildingsCorrected: null, skybridges: null, spanItems: [], cuts: null, mode: 'corrected', showMissing: false, focusChanges: false, hostIds: new Set(), correctedIds: new Set(), baseStatus: ''};
const tip = document.getElementById('tip');
const status = document.getElementById('status');

async function loadJSON(url) {
  try { const r = await fetch(url); if (!r.ok) return null; return await r.json(); }
  catch (e) { return null; }
}

// SolidPolygonLayer renders ONE polygon (with optional holes) per data item and
// does NOT accept MultiPolygon. So we explode every span feature into one item
// per constituent polygon. Each item carries its rings + the span's properties.
function explodeSpans(fc) {
  const items = [];
  for (const f of (fc && fc.features) || []) {
    const g = f.geometry;
    const polys = g.type === 'MultiPolygon' ? g.coordinates : [g.coordinates];
    for (const rings of polys) items.push({rings, properties: f.properties});
  }
  return items;
}

// Lift mechanism for deck.gl: there is NO fill-extrusion-base. We inject the
// float base into the polygon's Z coordinates; SolidPolygonLayer then adds
// getElevation (the thickness) on top of that vertex base altitude — so the
// deck floats. Returns an array of rings (outer + holes) with Z = baseZ.
function liftRings(rings, baseZ) {
  return rings.map(ring => ring.map(([x, y]) => [x, y, baseZ]));
}

// Focus mode: thin the building layer to only the buildings a correction
// involves. The span/cut overlays (separate layers) are untouched, so in
// 'corrected' the lifted spans and in 'footprint' the cut patches stay visible.
//   corrected/footprint (correctedSrc): the modified dataset carries a `carved`
//     flag — keep carved hosts. bridge_struct/geom polygons are already gone
//     from this dataset (shown as floating spans), so nothing involved is lost.
//   raw: no `carved` flag, so match the same hosts by osm_id (state.hostIds),
//     PLUS the polygons lifted into spans — present in raw but absent from the
//     corrected dataset — so the structures a correction acts on stay on screen.
// osm_id is assumed unique within the export radius (osm_type isn't exported);
// that holds for the shipped regions. Memoised on (mode, source) so a
// recolor-only rebuild reuses the same data reference and deck.gl can skip
// re-tessellating the filtered set.
let _focusCache = {key: null, src: null, fc: null};
function focusFilter(fc, correctedSrc) {
  if (!state.focusChanges || !fc) return fc;
  const key = state.mode + (correctedSrc ? ':c' : ':r');
  if (_focusCache.key === key && _focusCache.src === fc) return _focusCache.fc;
  const keep = correctedSrc
    ? f => f.properties.carved === true
    : f => state.hostIds.has(f.properties.osm_id)
        || (state.correctedIds.size > 0 && !state.correctedIds.has(f.properties.osm_id));
  const out = {type: 'FeatureCollection', features: fc.features.filter(keep)};
  _focusCache = {key, src: fc, fc: out};
  return out;
}

function buildLayers() {
  const layers = [];
  const modified = state.mode !== 'raw';   // corrected & footprint use the cut footprints

  // Buildings: raw (the solid-wall bug) vs modified (span regions cut out).
  // useCorrected tracks the dataset actually shown (not just the mode) so focus
  // filters correctly when the corrected data is absent (Phase 0 falls to raw).
  const useCorrected = !!(modified && state.buildingsCorrected);
  const bdata = focusFilter(useCorrected ? state.buildingsCorrected : state.buildings, useCorrected);
  if (state.baseStatus) {
    if (state.focusChanges) {
      const n = bdata ? bdata.features.length : 0;
      // report only the overlay actually drawn in this mode (spans → corrected,
      // cuts → footprint; raw draws neither), so the count never overstates.
      const extra = state.mode === 'corrected' ? ` · ${state.spanItems.length} spans`
        : state.mode === 'footprint' && state.cuts ? ` · ${state.cuts.features.length} cuts`
        : '';
      status.textContent = `focus: ${n} changed buildings${extra}`;
    } else {
      status.textContent = state.baseStatus;
    }
  }
  if (bdata) {
    layers.push(new GeoJsonLayer({
      id: 'buildings',
      data: bdata,
      extruded: true,
      getElevation: f => f.properties.top_h || 8,
      getFillColor: f => state.showMissing && f.properties.missing_base
        ? [230, 150, 90] : [150, 160, 180],
      getLineColor: [60, 60, 70, 0],
      material: {ambient: 0.45, diffuse: 0.6, shininess: 16},
      pickable: true,
      autoHighlight: true,
      // OPAQUE highlight: a semi-transparent highlight over an extruded polygon
      // double-draws at every tessellation triangle edge, revealing a "fan" of
      // thin triangles on the hovered building. Opaque overwrites instead.
      highlightColor: [235, 225, 165, 255],
      updateTriggers: {getFillColor: [state.showMissing]}
    }));
  }

  // 'footprint' mode: show the REMOVED region as a flat red patch on the ground,
  // so the modified footprint (building minus this) is explicit.
  if (state.mode === 'footprint' && state.cuts) {
    layers.push(new GeoJsonLayer({
      id: 'cuts',
      data: state.cuts,
      extruded: false,
      stroked: true, filled: true,
      getFillColor: [235, 90, 90, 150],
      getLineColor: [200, 40, 40, 255], getLineWidth: 1.5, lineWidthUnits: 'pixels', lineWidthMinPixels: 1.5,
      parameters: {depthTest: false},
      pickable: false
    }));
  }

  // 'corrected' mode: detected spans lifted to their float base (Z-lifted single
  // polygons; SolidPolygonLayer can't take MultiPolygon so spans were exploded).
  if (state.mode === 'corrected' && state.spanItems.length) {
    layers.push(new SolidPolygonLayer({
      id: 'skybridges',
      data: state.spanItems,
      extruded: true,
      getPolygon: d => liftRings(d.rings, d.properties.base_h || 0),
      getElevation: d => Math.max(1, (d.properties.top_h || 0) - (d.properties.base_h || 0)),
      getFillColor: d => d.properties.class === 'footbridge' ? [255, 170, 90, 235] : [90, 150, 255, 235],
      material: {ambient: 0.5, diffuse: 0.7, shininess: 24},
      pickable: true
    }));
  }
  overlay.setProps({layers});
}

function showTip(info) {
  if (!info || !info.object) { tip.style.display = 'none'; return; }
  const p = info.object.properties || {};
  tip.style.display = 'block';
  tip.style.left = info.x + 12 + 'px';
  tip.style.top = info.y + 12 + 'px';
  tip.innerHTML = `<b>${p.name || p.kind || 'feature'}</b><br>osm_id ${p.osm_id || '?'}<br>`
    + `base ${p.base_h ?? 0} m → top ${p.top_h ?? '?'} m`
    + (p.reason ? `<br>reason: ${p.reason}` : '')
    + (p.confidence ? `<br>confidence: ${p.confidence}` : '')
    + (p.missing_base ? '<br><i>missing float base</i>' : '');
}
overlay.setProps({onHover: showTip});

document.getElementById('viewMode').onchange = e => { state.mode = e.target.value; buildLayers(); };
document.getElementById('toggleMissing').onchange = e => { state.showMissing = e.target.checked; buildLayers(); };
document.getElementById('toggleFocus').onchange = e => { state.focusChanges = e.target.checked; buildLayers(); };
document.getElementById('flyFocus').onclick = () =>
  map.flyTo({center: FOCUS.center, zoom: FOCUS.zoom, pitch: FOCUS.pitch, bearing: FOCUS.bearing});

// (Re)load every dataset from `prefix` ('data/' live, 'data/sandbox/' tuner)
// and rebuild the layers. `bust` busts the browser cache after a tuner re-run.
async function loadData(prefix, bust) {
  const v = bust ? `?v=${bust}` : '';
  state.buildings = await loadJSON(prefix + 'buildings.geojson' + v);
  state.buildingsCorrected = await loadJSON(prefix + 'buildings_corrected.geojson' + v); // Phase 2+
  state.skybridges = await loadJSON(prefix + 'skybridges.geojson' + v);   // may not exist yet (Phase 0)
  state.cuts = await loadJSON(prefix + 'cuts.geojson' + v);               // Phase 2+ (modified footprint)
  state.spanItems = explodeSpans(state.skybridges);
  // Sets that drive focus mode (built from the corrected dataset):
  //   correctedIds — every osm_id present after correction; a raw building NOT
  //     in here was lifted into a span, so focus keeps it visible in raw mode.
  //   hostIds      — the carved hosts (a span cuts into them); the buildings a
  //     correction touches in every mode.
  state.hostIds = new Set();
  state.correctedIds = new Set();
  for (const f of (state.buildingsCorrected && state.buildingsCorrected.features) || []) {
    state.correctedIds.add(f.properties.osm_id);
    if (f.properties.carved) state.hostIds.add(f.properties.osm_id);
  }
  _focusCache = {key: null, src: null, fc: null};   // datasets changed → stale
  // Nothing changed → nothing to focus on: disable the toggle (Phase-0 / raw
  // regions) so it can't blank the map.
  const focusEl = document.getElementById('toggleFocus');
  if (!state.spanItems.length && !state.hostIds.size) {
    focusEl.disabled = true;
    focusEl.parentElement.title = 'no corrections detected yet — run `make sql && make export`';
  } else {
    focusEl.disabled = false;
  }
  const nb = state.buildings ? state.buildings.features.length : 0;
  const ns = state.spanItems.length;
  state.baseStatus = `${nb.toLocaleString()} buildings · ${ns} detected spans`
    + (ns ? '' : ' (run `make sql && make export` to detect spans)');
  status.textContent = state.baseStatus;
  buildLayers();
}

map.on('load', async () => {
  // per-region camera + labels (always from the live export; the sandbox is a
  // subset of the same region, so the camera is identical)
  const meta = await loadJSON('data/meta.json');
  if (meta && meta.center) {
    FOCUS = Object.assign(FOCUS, meta);
    map.jumpTo({center: FOCUS.center, zoom: FOCUS.zoom, pitch: FOCUS.pitch, bearing: FOCUS.bearing});
    document.getElementById('flyFocus').textContent = '↪ fly to ' + (FOCUS.label || 'focus');
    document.querySelector('#panel h1').textContent = 'OSM Skybridge Viewer — ' + (FOCUS.label || '');
  }
  const tuner = await initTuner();          // detects `make tuner`; null under `make viewer`
  if (!tuner) initSettingsRO();             // read-only settings panel instead
  await loadData(tuner ? 'data/sandbox/' : 'data/', 0);
});

// Read-only processing-settings panel (plain `make viewer`): shows the values
// the current exports were derived with, from data/config.json (written by
// `make export`). The live tuner supersedes it — same values, editable.
async function initSettingsRO() {
  const cfg = await loadJSON('data/config.json');
  if (!cfg || !cfg.values) return;          // older export without the snapshot
  const el = document.getElementById('settingsRO');
  const grid = el.querySelector('.grid');
  for (const [key, val] of Object.entries(cfg.values)) {
    const m = (cfg.meta && cfg.meta[key]) || {};
    const k = document.createElement('span');
    k.textContent = key;
    k.title = (m.descr || '') + (m.stage ? ` [stage: ${m.stage}]` : '');
    const v = document.createElement('span');
    v.className = 'v';
    v.textContent = val;
    grid.append(k, v);
  }
  if (cfg.generated) el.querySelector('.when').textContent =
    'as of ' + new Date(cfg.generated).toLocaleString();
  el.style.display = 'block';
}

// ─── live tuner client ──────────────────────────────────────────────────────
// Only active when pipeline/tuner.py is serving (GET /api/config succeeds);
// under plain `make viewer` the fetch 404s and the panel stays hidden.
async function initTuner() {
  let cfg = null;
  try {
    const r = await fetch('/api/config');
    if (r.ok) cfg = await r.json();
  } catch (e) { /* static server → no tuner */ }
  if (!cfg || !cfg.knobs) return null;

  const el = document.getElementById('tuner');
  el.style.display = 'block';
  const badge = document.getElementById('sandboxBadge');
  badge.style.display = 'inline-block';
  if (cfg.data_mode === 'sample') {
    badge.textContent = 'SAMPLE';
    badge.title = 'synthetic fixture data (make tuner-sample) — one case per geometry pathology';
  }
  const tStatus = document.getElementById('tunerStatus');
  const STAGE_COST = {prepare: 'slowest — full re-derive', detect: 'slow — re-detect',
                      correct: 'medium — re-correct', finalize: 'fast', export: 'fastest — re-export only'};

  function render(knobs) {
    const box = document.getElementById('tunerKnobs');
    box.innerHTML = '';
    let stage = null;
    for (const k of knobs) {
      if (k.stage !== stage) {
        stage = k.stage;
        const h = document.createElement('div');
        h.className = 'stage';
        h.innerHTML = `${stage} <span class="cost">· ${STAGE_COST[stage] || ''}</span>`;
        box.appendChild(h);
      }
      const row = document.createElement('div');
      row.className = 'knob' + (k.dirty ? ' dirty' : '');
      row.innerHTML = `<label title="${k.descr} (default ${k.file_default})">${k.key}</label>
        <input type="range" min="${k.min}" max="${k.max}" step="${k.step}" value="${k.value}">
        <input type="number" min="${k.min}" max="${k.max}" step="${k.step}" value="${k.value}">
        <button class="undo" title="reset ${k.key} to its default (${k.file_default})">↺</button>`;
      const [range, num] = row.querySelectorAll('input');
      const set = v => { postSet(k.key, v); row.classList.add('dirty'); };
      range.oninput = () => { num.value = range.value; };          // live readout
      range.onchange = () => set(parseFloat(range.value));          // commit on release
      let deb = null;                                               // debounce typing
      num.oninput = () => { range.value = num.value;
        clearTimeout(deb); deb = setTimeout(() => set(parseFloat(num.value)), 300); };
      row.querySelector('.undo').onclick = () => {                  // per-knob reset
        range.value = num.value = k.file_default;
        set(k.file_default);
        row.classList.remove('dirty');
      };
      box.appendChild(row);
    }
  }
  render(cfg.knobs);

  async function postSet(key, value) {
    setChip('run', `queued ${key}…`);   // instant feedback; poll takes over <1 s later
    await fetch('/api/set', {method: 'POST', body: JSON.stringify({key, value})});
  }
  async function post(path, confirmMsg) {
    if (confirmMsg && !window.confirm(confirmMsg)) return;
    setChip('run', 'queued…');
    const r = await fetch(path, {method: 'POST', body: '{}'});
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.error) setChip('err', '✗ ' + (j.error || r.status));
  }
  document.getElementById('tApply').onclick = () =>
    post('/api/apply', 'Apply the tuned values to the REAL dataset?\nThis re-derives the live database and overwrites web/data/*.geojson.');
  document.getElementById('tSave').onclick = () =>
    post('/api/save', 'Write the tuned values into sql/01_prepare.sql as the new defaults?');
  document.getElementById('tRevert').onclick = () => post('/api/revert');
  document.getElementById('tReseed').onclick = () =>
    post('/api/reseed', 'Rebuild the sandbox database from the live raw import?');

  // status poll: drives the status chip, locks the action buttons during a run,
  // and refetches sandbox data whenever a run completes (run_seq bumps).
  const actionBtns = ['tApply', 'tSave', 'tRevert', 'tReseed'].map(id => document.getElementById(id));
  const setChip = (cls, text) => {
    tStatus.className = cls;
    tStatus.innerHTML = '<span class="chip"></span>';
    tStatus.querySelector('.chip').textContent = text;
  };
  let lastSeq = cfg.run_seq || 0, lastState = null, okTimer = null;
  setInterval(async () => {
    let s = null;
    try { s = await (await fetch('/api/status')).json(); } catch (e) { return; }
    const running = s.state === 'running';
    actionBtns.forEach(b => { b.disabled = running; });
    if (running) {
      clearTimeout(okTimer);
      setChip('run', `re-running ${s.stage} on ${s.mode}…`);
    } else if (s.state === 'error') {
      if (lastState !== 'error') {
        clearTimeout(okTimer);
        tStatus.className = 'err';
        tStatus.innerHTML = '<span class="chip">✗ pipeline / selfcheck failed</span>'
          + '<div>sandbox kept the last good data — back the knob off.</div><pre></pre>';
        tStatus.querySelector('pre').textContent = s.error_tail || '';
      }
    } else if (s.run_seq !== lastSeq) {
      lastSeq = s.run_seq;
      setChip('ok', `✓ done in ${s.last_secs}s — ` +
        (s.mode === 'live' ? 'LIVE dataset updated (web/data/)' : 'view refreshed'));
      clearTimeout(okTimer);
      okTimer = setTimeout(() => { if (tStatus.className === 'ok') { tStatus.className = ''; tStatus.textContent = ''; } }, 6000);
      if (s.mode !== 'live') await loadData('data/sandbox/', lastSeq);
      // refresh values + dirty markers from the server's view
      try { const c = await (await fetch('/api/config')).json(); if (c.knobs) render(c.knobs); } catch (e) {}
    } else if (s.state === 'idle' && lastState === 'running') {
      // run finished but produced no new data (e.g. coalesced no-op)
      tStatus.className = ''; tStatus.textContent = '';
    }
    lastState = s.state;
  }, 1000);
  return cfg;
}
</script>
</body>
</html>
